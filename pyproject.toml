[project]
name = "acquire-intel"
version = "0.1.0"
description = "AcquireIntel — a resilient, pluggable data-acquisition platform for product & price intelligence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Wassim Bannout" }]

# Runtime dependencies are added per-task as vertical slices land (spec-first).
# T0.1 scaffolds a runnable, dependency-light skeleton; load-bearing deps
# (Scrapy, Playwright, SQLAlchemy, Flask, pydantic) arrive with their tasks
# and each require an ADR (see docs/05 §"Dependency discipline").
dependencies = []

[project.scripts]
acquire-intel = "acquire_intel.cli:main"

[project.urls]
Homepage = "https://github.com/wassimbannout/acquire-intel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acquire_intel"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
]

# --- Ruff: lint + format -----------------------------------------------------
[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# A pragmatic-but-strict default set; expand per phase as real code lands.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["acquire_intel"]

[tool.ruff.format]
docstring-code-format = true

# --- Mypy: strict typing (ADR-0001: non-negotiable) --------------------------
[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true
mypy_path = "src"
files = ["src"]

# --- Pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
