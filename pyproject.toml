[project]
name = "acquire-intel"
version = "0.1.0"
description = "AcquireIntel — a resilient, pluggable data-acquisition platform for product & price intelligence."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Wassim Bannout" }]

# Runtime dependencies are added per-task as vertical slices land (spec-first).
# Load-bearing deps (Scrapy, Playwright, SQLAlchemy, Flask) arrive with their
# tasks; each is ratified by an ADR (see docs/05 §"Dependency discipline").
dependencies = [
    "pydantic-settings>=2.4",   # T0.2: typed env boundary (ADR-0008); pulls pydantic v2
    "sqlalchemy>=2.0",          # T0.3: typed ORM (ADR-0006)
    "alembic>=1.13",            # T0.3: schema migrations
    "psycopg[binary]>=3.1",     # T0.3: PostgreSQL driver (matches +psycopg URL)
    "scrapy>=2.11",             # T0.4: crawl backbone (ADR-0002)
    "structlog>=24.1",          # T0.4: structured JSON logging with run_id (docs/07)
    "flask>=3.0",               # T0.5: read/serve API + dashboard (ADR-0007)
]

[project.scripts]
acquire-intel = "acquire_intel.cli:main"

[project.urls]
Homepage = "https://github.com/wassimbannout/acquire-intel"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acquire_intel"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "mypy>=1.11",
    "pytest>=8",
]

# --- Ruff: lint + format -----------------------------------------------------
[tool.ruff]
src = ["src", "tests"]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
# A pragmatic-but-strict default set; expand per phase as real code lands.
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # ruff-specific
]

[tool.ruff.lint.isort]
known-first-party = ["acquire_intel"]

[tool.ruff.lint.per-file-ignores]
# SQLAlchemy resolves Mapped[...] annotations at runtime (PEP 563 + declarative),
# so datetime/Decimal/Any must stay importable at runtime — not TYPE_CHECKING-only.
"src/acquire_intel/storage/models.py" = ["TC001", "TC002", "TC003"]
# Alembic-generated migrations: leave their import layout as emitted.
"src/acquire_intel/storage/migrations/versions/*" = ["I001", "TC001", "TC002", "TC003"]

[tool.ruff.format]
docstring-code-format = true

# --- Mypy: strict typing (ADR-0001: non-negotiable) --------------------------
[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unreachable = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_any_unimported = true
mypy_path = "src"
files = ["src"]

# --- Pytest ------------------------------------------------------------------
[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integration: requires a live Postgres (docker compose up); skipped if unreachable",
]
