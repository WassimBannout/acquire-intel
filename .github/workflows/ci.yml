name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-type-test:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+psycopg://acquire:acquire@localhost:5432/acquire
      FLASK_SECRET_KEY: ci-secret
      ADMIN_TOKEN: ci-token

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: acquire
          POSTGRES_PASSWORD: acquire
          POSTGRES_DB: acquire
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U acquire -d acquire"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install dependencies (locked)
        run: uv sync --locked

      - name: Install Playwright browser (for the HTML render test)
        run: uv run playwright install --with-deps chromium

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Mypy (strict)
        run: uv run mypy src harness

      - name: Apply DB migrations
        run: uv run alembic upgrade head

      - name: Pytest (unit + integration)
        run: uv run pytest -q
