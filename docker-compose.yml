# Local dev/test infrastructure. Postgres 16 per ADR-0006.
#
# Host port is configurable via DB_HOST_PORT (default 5432, matching docs/05). Set it if
# something else already owns 5432, e.g.:  DB_HOST_PORT=5544 docker compose up -d
# and point DATABASE_URL at that port.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: acquire
      POSTGRES_PASSWORD: acquire
      POSTGRES_DB: acquire
    ports:
      - "${DB_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U acquire -d acquire"]
      interval: 3s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
